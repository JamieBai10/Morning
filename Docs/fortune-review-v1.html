<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    :root { --ink:#11110d; --muted:#726f66; --line:#e7e3d9; --canvas:#f1efe8; --paper:#fffefa; --accent:#20201c; --warm:#eee9dc; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    header { position:sticky; top:0; z-index:10; background:rgba(241,239,232,.94); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); padding:28px max(28px,calc((100vw - 1240px)/2)); }
    h1 { margin:0; font-size:24px; letter-spacing:-.5px; } p { margin:7px 0 0; color:var(--muted); font-size:13px; }
    .toolbar { display:flex; gap:10px; align-items:center; margin-top:20px; flex-wrap:wrap; }
    input[type=search] { width:320px; max-width:100%; border:1px solid var(--line); border-radius:10px; background:var(--paper); padding:10px 12px; color:var(--ink); font:14px inherit; outline:none; }
    input[type=search]:focus, textarea:focus { border-color:#888276; box-shadow:0 0 0 3px rgba(95,89,76,.12); }
    label { color:var(--muted); font-size:13px; display:flex; gap:7px; align-items:center; }
    button { border:0; border-radius:10px; background:var(--accent); color:#fff; padding:10px 13px; font:600 13px inherit; cursor:pointer; }
    button.secondary { background:var(--warm); color:var(--ink); } button:hover { filter:brightness(.95); }
    #count { margin-left:auto; color:var(--muted); font-size:13px; }
    main { width:min(1240px,calc(100% - 56px)); margin:26px auto 64px; }
    .columns, .row { display:grid; grid-template-columns:104px minmax(300px,1fr) minmax(300px,1fr); gap:18px; }
    .columns { color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.08em; padding:0 16px 10px; }
    .row { background:var(--paper); border:1px solid var(--line); border-radius:15px; padding:17px 16px; margin-bottom:10px; align-items:start; box-shadow:0 8px 20px rgba(36,32,23,.035); }
    .id { color:var(--muted); font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace; padding-top:3px; }
    .english { font:500 15px/1.5 Georgia,"Times New Roman",serif; } .chinese { margin-top:8px; color:#46443e; font-size:14px; line-height:1.55; }
    textarea { display:block; width:100%; min-height:92px; resize:vertical; border:1px solid var(--line); border-radius:10px; background:#fbfaf5; padding:11px 12px; color:var(--ink); font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; outline:none; }
    .empty { padding:46px; text-align:center; color:var(--muted); }
    @media (max-width:760px) { header { padding:22px 18px; } main { width:calc(100% - 28px); margin-top:18px; } .columns { display:none; } .row { grid-template-columns:1fr; gap:12px; } .id { padding:0; } #count { width:100%; margin-left:0; } }

    const quotes = [{"id":"morning-001","chinese":"先走眼前看得见的一步。让路回应你。","english":"Begin with the next visible step. Let the path respond."},{"id":"morning-002","chinese":"兑现一个对自己的小承诺。让路回应你。","english":"Keep one small promise to yourself. Let the path respond."},{"id":"morning-003","chinese":"守住今天最重要的那一小时。让路回应你。","english":"Protect the hour that matters most. Let the path respond."},{"id":"morning-004","chinese":"给一个更好的问题留出位置。让路回应你。","english":"Make room for a better question. Let the path respond."},{"id":"morning-005","chinese":"让好奇心决定第一步。让路回应你。","english":"Let curiosity choose the first move. Let the path respond."},{"id":"morning-006","chinese":"不必匆忙，事情也可以真实发生。让路回应你。","english":"You do not need to rush to be real. Let the path respond."},{"id":"morning-007","chinese":"用最小的可重复行动建立信任。让路回应你。","english":"Build trust through the smallest repeatable act. Let the path respond."},{"id":"morning-008","chinese":"你的注意力本身就是一种照料。让路回应你。","english":"Your attention is already a form of care. Let the path respond."},{"id":"morning-009","chinese":"温柔的开始，仍然是开始。让路回应你。","english":"A gentle start still counts as a start. Let the path respond."},{"id":"morning-010","chinese":"清晰常常出现在行动之后。让路回应你。","english":"Clarity often follows motion. Let the path respond."},{"id":"morning-011","chinese":"把一个未完成的念头带到世界里。让路回应你。","english":"Move one unfinished thought into the world. Let the path respond."},{"id":"morning-012","chinese":"给那个好想法一个落点。让路回应你。","english":"Give the good idea a place to land. Let the path respond."},{"id":"morning-013","chinese":"按你的判断力承受得住的速度工作。让路回应你。","english":"Work at the pace your judgment can hold. Let the path respond."},{"id":"morning-014","chinese":"留下有用的部分，其余的放下。让路回应你。","english":"Keep the useful part; release the rest. Let the path respond."},{"id":"morning-015","chinese":"平常的小事，也许正是入口。让路回应你。","english":"The ordinary task may be the doorway. Let the path respond."},{"id":"morning-016","chinese":"让第一稿诚实，而不必完美。让路回应你。","english":"Allow the first draft to be honest, not perfect. Let the path respond."},{"id":"morning-017","chinese":"计划可以弯，意图不要丢。让路回应你。","english":"If the plan bends, keep the intention. Let the path respond."},{"id":"morning-018","chinese":"从今天真正给你的东西里学习。让路回应你。","english":"Learn from what the day actually gives you. Let the path respond."},{"id":"morning-019","chinese":"暂停，也可以是进展的一部分。让路回应你。","english":"A pause can be part of the progress. Let the path respond."},{"id":"morning-020","chinese":"做那件只要两分钟的善意小事。让路回应你。","english":"Do the kind thing that takes two minutes. Let the path respond."},{"id":"morning-021","chinese":"让空白暂时保持可用。让路回应你。","english":"Let the blank space stay available. Let the path respond."},{"id":"morning-022","chinese":"安静的工作，也能走得很远。让路回应你。","english":"Quiet work can carry far. Let the path respond."},{"id":"morning-023","chinese":"把下一件工具放到触手可及的地方。让路回应你。","english":"Place the next tool within reach. Let the path respond."},{"id":"morning-024","chinese":"给晚上的自己留一点力气。让路回应你。","english":"Save a little energy for the evening self. Let the path respond."},{"id":"morning-025","chinese":"一句清楚的话，能改变一个房间。让路回应你。","english":"One clear sentence can change the room. Let the path respond."},{"id":"morning-026","chinese":"先把决定变小，再把它做好。让路回应你。","english":"Make the decision smaller before making it bigger. Let the path respond."},{"id":"morning-027","chinese":"留意那件本可以更简单的事。让路回应你。","english":"Notice the task that is asking to be simple. Let the path respond."},{"id":"morning-028","chinese":"别把嘈杂误认为紧急。让路回应你。","english":"Do not confuse noise with urgency. Let the path respond."},{"id":"morning-029","chinese":"让熟悉的路教你一点新的东西。让路回应你。","english":"Let a familiar path teach you something new. Let the path respond."},{"id":"morning-030","chinese":"有用的边界，会带来松弛。让路回应你。","english":"A useful boundary can feel like relief. Let the path respond."},{"id":"morning-031","chinese":"先把第一个答案画成草图。让路回应你。","english":"Let the first answer be a sketch. Let the path respond."},{"id":"morning-032","chinese":"平静地说不，才能保护重要的答应。让路回应你。","english":"A calm no can protect a meaningful yes. Let the path respond."},{"id":"morning-033","chinese":"精力低时，就缩小要处理的面。让路回应你。","english":"When energy is low, reduce the surface area. Let the path respond."},{"id":"morning-034","chinese":"问问什么能让这件事轻一点。让路回应你。","english":"Ask what would make this lighter. Let the path respond."},{"id":"morning-035","chinese":"回到那件让你更像自己的工作。让路回应你。","english":"Return to the work that makes you more yourself. Let the path respond."},{"id":"morning-036","chinese":"一个实际的细节，也能托住大梦想。让路回应你。","english":"A practical detail can carry a big dream. Let the path respond."},{"id":"morning-037","chinese":"在日程里留一点惊奇。让路回应你。","english":"Keep a little wonder in the schedule. Let the path respond."},{"id":"morning-038","chinese":"你反复做的事，都是安静的一票。让路回应你。","english":"What you repeat becomes a quiet vote. Let the path respond."},{"id":"morning-039","chinese":"别等情绪完美，再开始。让路回应你。","english":"Start before the mood becomes perfect. Let the path respond."},{"id":"morning-040","chinese":"让足够好的版本先教会你。让路回应你。","english":"Let the good enough version teach you. Let the path respond."},{"id":"morning-041","chinese":"下一次交谈，可能藏着缺失的一块。让路回应你。","english":"The next conversation may hold the missing piece. Let the path respond."},{"id":"morning-042","chinese":"给难事一个柔软的入口。让路回应你。","english":"Give the hard thing a softer entrance. Let the path respond."},{"id":"morning-043","chinese":"你的节奏是信息，不是缺点。让路回应你。","english":"Your pace is information, not a flaw. Let the path respond."},{"id":"morning-044","chinese":"走那条让你更清醒的路。让路回应你。","english":"Take the route that leaves you more awake. Let the path respond."},{"id":"morning-045","chinese":"先给想法一个家，再判断它。让路回应你。","english":"Make a home for the idea before judging it. Let the path respond."},{"id":"morning-046","chinese":"跟随那条有真实质感的线索。让路回应你。","english":"Follow the thread with real texture. Let the path respond."},{"id":"morning-047","chinese":"在决定之间，让工作透透气。让路回应你。","english":"Let the work breathe between decisions. Let the path respond."},{"id":"morning-048","c 回整个下午。也给今天留一点空白。","english":"A small repair can restore a whole afternoon. Keep the day spacious."},{"id":"morning-110","chinese":"选择你能持续下去的版本。也给今天留一点空白。","english":"Choose the version that you can sustain. Keep the day spacious."},{"id":"morning-111","chinese":"把专注当作需要准备的事情。也给今天留一点空白。","english":"Treat focus as something you prepare for. Keep the day spacious."},{"id":"morning-112","chinese":"给自己留一次再看的机会。也给今天留一点空白。","english":"Make space for a second look. Keep the day spacious."},{"id":"morning-113","chinese":"让有用的信号浮到上面。也给今天留一点空白。","english":"Let the useful signal rise above the signal. Keep the day spacious."},{"id":"morning-114","chinese":"别太早借来明天的压力。也给今天留一点空白。","english":"Do not borrow tomorrow's pressure too early. Keep the day spacious."},{"id":"morning-115","chinese":"一天里可以有不止一次开始。也给今天留一点空白。","english":"The day can hold more than one beginning. Keep the day spacious."},{"id":"morning-116","chinese":"给未完成的事一个清楚的下一步。也给今天留一点空白。","english":"Give the unfinished thing a clear next step. Keep the day spacious."},{"id":"morning-117","chinese":"一点秩序，能为玩心腾出位置。也给今天留一点空白。","english":"A little order can make room for play. Keep the day spacious."},{"id":"morning-118","chinese":"从你的手已经会做的地方开始。也给今天留一点空白。","english":"Begin where your hands already know how to help. Keep the day spacious."},{"id":"morning-119","chinese":"也让身体为节奏投一票。也给今天留一点空白。","english":"Let the body vote on the pace too. Keep the day spacious."},{"id":"morning-120","chinese":"犹豫时，让邀请更温暖一点。也给今天留一点空白。","english":"When in doubt, make the invitation warmer. Keep the day spacious."},{"id":"morning-121","chinese":"留下一点你来过的证据。也给今天留一点空白。","english":"Leave evidence that you were here. Keep the day spacious."},{"id":"morning-122","chinese":"用一件变轻的事结束今天。也给今天留一点空白。","english":"End the day with one thing made lighter. Keep the day spacious."},{"id":"morning-123","chinese":"先走眼前看得见的一步。留意什么开始变得轻松。","english":"Begin with the next visible step. Notice what becomes easier."},{"id":"morning-124","chinese":"兑现一个对自己的小承诺。留意什么开始  to what matters."},{"id":"morning-356","chinese":"给自己留一次再看的机会。再回到真正重要的地方。","english":"Make space for a second look. Return to what matters."},{"id":"morning-357","chinese":"让有用的信号浮到上面。再回到真正重要的地方。","english":"Let the useful signal rise above the signal. Return to what matters."},{"id":"morning-358","chinese":"别太早借来明天的压力。再回到真正重要的地方。","english":"Do not borrow tomorrow's pressure too early. Return to what matters."},{"id":"morning-359","chinese":"一天里可以有不止一次开始。再回到真正重要的地方。","english":"The day can hold more than one beginning. Return to what matters."},{"id":"morning-360","chinese":"给未完成的事一个清楚的下一步。再回到真正重要的地方。","english":"Give the unfinished thing a clear next step. Return to what matters."},{"id":"morning-361","chinese":"一点秩序，能为玩心腾出位置。再回到真正重要的地方。","english":"A little order can make room for play. Return to what matters."},{"id":"morning-362","chinese":"从你的手已经会做的地方开始。再回到真正重要的地方。","english":"Begin where your hands already know how to help. Return to what matters."},{"id":"morning-363","chinese":"也让身体为节奏投一票。再回到真正重要的地方。","english":"Let the body vote on the pace too. Return to what matters."},{"id":"morning-364","chinese":"犹豫时，让邀请更温暖一点。再回到真正重要的地方。","english":"When in doubt, make the invitation warmer. Return to what matters."},{"id":"morning-365","chinese":"留下一点你来过的证据。再回到真正重要的地方。","english":"Leave evidence that you were here. Return to what matters."},{"id":"morning-366","chinese":"用一件变轻的事结束今天。再回到真正重要的地方。","english":"End the day with one thing made lighter. Return to what matters."}];
    const storageKey = 'morning-fortune-review-v1';
    const notes = JSON.parse(localStorage.getItem(storageKey) || '{}');
    const rows = document.getElementById('rows');
    const search = document.getElementById('search');
    const changedOnly = document.getElementById('changedOnly');
    const count = document.getElementById('count');
    function changedEntries() { return quotes.filter(q => (notes[q.id] || '').trim()).map(q => ({ id:q.id, english:q.english, chinese:q.chinese, change:notes[q.id].trim() })); }
    function persist() { localStorage.setItem(storageKey, JSON.stringify(notes)); }
    function render() {
      const term = search.value.trim().toLowerCase();
      const filtered = quotes.filter(q => {
        const matches = !term || [q.id,q.english,q.chinese].join(' ').toLowerCase().includes(term);
        return matches && (!changedOnly.checked || (notes[q.id] || '').trim());
      });
      count.textContent = `显示 ${filtered.length} / ${quotes.length} 条 · 已修改 ${changedEntries().length} 条`;
      rows.replaceChildren();
      if (!filtered.length) { rows.innerHTML = '<div class="empty">没有符合条件的 quote。</div>'; return; }
      for (const q of filtered) {
        const row = document.createElement('article'); row.className = 'row';
        const id = document.createElement('div'); id.className = 'id'; id.textContent = q.id;
        const quote = document.createElement('div');
        const english = document.createElement('div'); english.className = 'english'; english.textContent = q.english;
        const chinese = document.createElement('div'); chinese.className = 'chinese'; chinese.textContent = q.chinese;
        quote.append(english, chinese);
        const editor = document.createElement('textarea'); editor.placeholder = '例如：\n英文改为…\n中文改为…\n或写下修改原因'; editor.value = notes[q.id] || '';
        editor.addEventListener('input', () => { notes[q.id] = editor.value; persist(); count.textContent = `显示 ${filtered.length} / ${quotes.length} 条 · 已修改 ${changedEntries().length} 条`; });
        row.append(id, quote, editor); rows.append(row);
      }
    }
    search.addEventListener('input', render); changedOnly.addEventListener('change', render);
    document.getElementById('copy').addEventListener('click', async () => { const text = JSON.stringify(changedEntries(), null, 2); await navigator.clipboard.writeText(text); alert(`已复制 ${changedEntries().length} 条修改。`); });
    document.getElementById('download').addEventListener('click', () => { const blob = new Blob([JSON.stringify(changedEntries(), null, 2)], {type:'application/json'}); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'morning-fortune-edits.json'; link.click(); URL.revokeObjectURL(link.href); });
    document.getElementById('clear').addEventListener('click', () => { if (confirm('确定清空这台设备上所有尚未导出的修改吗？')) { Object.keys(notes).forEach(key => delete notes[key]); persist(); render(); } });
    render();
  </script>
